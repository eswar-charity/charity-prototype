services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: charity
      POSTGRES_PASSWORD: charity
      POSTGRES_DB: charity
    ports: ["5432:5432"]
    volumes: ["charity_pg:/var/lib/postgresql/data"]
  test_db:
    image: postgres:16
    environment:
      POSTGRES_USER: charity
      POSTGRES_PASSWORD: charity
      POSTGRES_DB: charity_test
    ports: ["5433:5432"]
volumes:
  charity_pg:
